
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project - ProjectFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button,
        .back-button {
            padding: 12px 20px;
            border-radius: 7px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-button {
            border: 1px solid #d1d5db;
            color: #374151;
            background: white;
        }

        .back-button:hover {
            background: #f3f4f6;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 20px;
            }

            .container {
                margin: 25px auto;
            }

            .card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>ProjectFlow</h1>
    </div>

    <div class="container">

        <div class="card">

            <h2>Create New Project</h2>

            <p class="subtitle">
                Create a project and start managing your team's tasks.
            </p>

            <form method="POST">

                {% csrf_token %}

                <label for="name">Project Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter project name"
                    required
                >

                <label for="description">Project Description</label>

                <textarea
                    id="description"
                    name="description"
                    rows="6"
                    placeholder="Describe your project..."
                ></textarea>

                <div class="buttons">

                    <button type="submit">
                        Create Project
                    </button>

                    <a
                        href="{% url 'dashboard' %}"
                        class="back-button"
                    >
                        Back to Dashboard
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
