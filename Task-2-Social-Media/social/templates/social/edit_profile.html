{% extends 'social/base.html' %}

{% block title %}
Edit Profile - Connectly
{% endblock %}

{% block content %}

<style>

    .edit-wrapper {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
    }

    .edit-card {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        border: 1px solid #e8eaf0;
    }

    .edit-header {
        text-align: center;
        margin-bottom: 25px;
    }

    .edit-icon {
        width: 70px;
        height: 70px;
        margin: 0 auto 15px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1877f2, #6c5ce7);
        color: white;
        font-size: 30px;
    }

    .edit-header h2 {
        margin-bottom: 8px;
        color: #1c1e21;
    }

    .edit-header p {
        color: #65676b;
        font-size: 14px;
    }

    .current-picture {
        text-align: center;
        margin-bottom: 22px;
    }

    .current-picture img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid white;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .default-picture {
        width: 100px;
        height: 100px;
        margin: auto;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1877f2, #6c5ce7);
        color: white;
        font-size: 40px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }

    .form-group textarea,
    .form-group input[type="file"] {
        width: 100%;
        box-sizing: border-box;
    }

    .form-group textarea {
        min-height: 120px;
        resize: vertical;
        padding: 12px;
        border: 1px solid #d5d9e0;
        border-radius: 9px;
        font-size: 15px;
        font-family: inherit;
        outline: none;
    }

    .form-group textarea:focus {
        border-color: #1877f2;
        box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.10);
    }

    .form-group input[type="file"] {
        padding: 10px;
        border: 1px solid #d5d9e0;
        border-radius: 9px;
        background: #f8f9fa;
        cursor: pointer;
    }

    .button-group {
        display: flex;
        gap: 12px;
        margin-top: 25px;
    }

    .save-button,
    .cancel-button {
        flex: 1;
        padding: 12px;
        border-radius: 9px;
        text-align: center;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
    }

    .save-button {
        border: none;
        background: linear-gradient(135deg, #1877f2, #6c5ce7);
        color: white;
    }

    .save-button:hover {
        box-shadow: 0 5px 15px rgba(24, 119, 242, 0.25);
    }

    .cancel-button {
        background: #f0f2f5;
        color: #333;
    }

    .cancel-button:hover {
        background: #e4e6eb;
    }

    @media (max-width: 500px) {

        .edit-card {
            padding: 25px 20px;
        }

        .button-group {
            flex-direction: column;
        }

    }

</style>


<div class="edit-wrapper">

    <div class="edit-card">


        <!-- Header -->

        <div class="edit-header">

            <div class="edit-icon">
                ✏️
            </div>

            <h2>
                Edit Profile
            </h2>

            <p>
                Update your profile information
            </p>

        </div>


        <!-- Current Profile Picture -->

        <div class="current-picture">

            {% if profile.profile_picture %}

                <img
                    src="{{ profile.profile_picture.url }}"
                    alt="Current Profile Picture"
                >

            {% else %}

                <div class="default-picture">
                    👤
                </div>

            {% endif %}

        </div>


        <!-- Edit Form -->

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- Bio -->

            <div class="form-group">

                <label for="bio">
                    About You
                </label>

                <textarea
                    id="bio"
                    name="bio"
                    placeholder="Write something about yourself..."
                >{{ profile.bio }}</textarea>

            </div>


            <!-- Profile Picture -->

            <div class="form-group">

                <label for="profile_picture">
                    Profile Picture
                </label>

                <input
                    type="file"
                    id="profile_picture"
                    name="profile_picture"
                    accept="image/*"
                >

            </div>


            <!-- Buttons -->

            <div class="button-group">

                <button
                    type="submit"
                    class="save-button"
                >
                    💾 Save Changes
                </button>

                <a
                    href="{% url 'profile' %}"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>


        </form>


    </div>

</div>

{% endblock %}
